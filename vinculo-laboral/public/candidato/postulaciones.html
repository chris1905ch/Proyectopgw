<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis postulaciones · Vínculo Laboral</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
<header id="cabecera"></header>
<main class="contenedor principal">

<div class="encabezado-pagina"><h1>Mis postulaciones</h1></div>
<div id="mensaje"></div>
<div class="tarjeta" id="tabla"></div>
</main>
<footer id="pie"></footer>
<script src="../js/app.js"></script>
<script>

if (montar({ rol: "candidato", activo: "postulaciones" })) {
  async function cargar() {
    const filas = await api("/candidato/postulaciones");
    document.getElementById("tabla").innerHTML = filas.length
      ? `<table><thead><tr><th>Oferta</th><th>Empresa</th><th>Enviada</th><th>Estado</th><th></th></tr></thead><tbody>${filas.map((p) => `<tr>
          <td><a href="/empleo.html?id=${p.oferta_id}">${esc(p.titulo)}</a></td><td>${esc(p.empresa)}</td><td>${fecha(p.creado_en)}</td><td>${etiqueta(p.estado)}</td>
          <td>${["enviada", "en_revision"].includes(p.estado) ? `<button class="boton peligro chico" data-id="${p.id}">Retirar</button>` : ""}</td></tr>`).join("")}</tbody></table>`
      : `<p class="vacio">Todavía no tiene postulaciones. <a href="/empleos.html">Buscar empleos</a></p>`;
  }
  document.getElementById("tabla").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-id]");
    if (!b || !confirm("¿Desea retirar esta postulación?")) return;
    try { await api(`/candidato/postulaciones/${b.dataset.id}/retirar`, { metodo: "PATCH" }); mensaje("#mensaje", "ok", "La postulación fue retirada."); cargar(); }
    catch (err) { mensaje("#mensaje", "error", err.message); }
  });
  cargar();
}

</script>
</body>
</html>
