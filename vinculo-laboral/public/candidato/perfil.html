<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil · Vínculo Laboral</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
<header id="cabecera"></header>
<main class="contenedor principal">

<div class="centrado ancho">
  <h1>Mi perfil</h1>
  <div id="mensaje"></div>
  <form id="form" class="tarjeta" novalidate>
    <div class="fila">
      <div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required></div>
      <div class="campo"><label for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" required></div>
    </div>
    <div class="fila">
      <div class="campo"><label for="correo">Correo electrónico</label><input id="correo" name="correo" disabled></div>
      <div class="campo"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" placeholder="0000-0000"></div>
    </div>
    <div class="campo"><label for="ubicacion">Departamento</label><select id="ubicacion" name="ubicacion"></select></div>
    <div class="campo"><label for="resumen">Resumen profesional</label><textarea id="resumen" name="resumen" maxlength="1500" placeholder="Estudios, experiencia y habilidades que quiera destacar"></textarea></div>
    <div class="campo"><label for="habilidades">Habilidades y conocimientos (separados por comas)</label><textarea id="habilidades" name="habilidades" maxlength="1000" placeholder="Excel, atención al cliente, licencia de conducir, bachillerato…"></textarea>
      <span class="pequeno suave">Se usa para mostrarle qué requisitos de cada oferta ya cumple y cuáles le faltan.</span></div>
    <button class="boton">Guardar cambios</button>
  </form>
  <form id="form-clave" class="tarjeta" style="margin-top:24px" novalidate>
    <h3>Cambiar contraseña</h3>
    <div id="mensaje-clave"></div>
    <div class="campo"><label for="actual">Contraseña actual</label><input id="actual" name="actual" type="password" autocomplete="current-password"></div>
    <div class="fila">
      <div class="campo"><label for="nueva">Contraseña nueva (mínimo 8 caracteres)</label><input id="nueva" name="nueva" type="password" autocomplete="new-password"></div>
      <div class="campo"><label for="confirmar">Confirmar contraseña nueva</label><input id="confirmar" name="confirmar" type="password" autocomplete="new-password"></div>
    </div>
    <button class="boton">Cambiar contraseña</button>
  </form>
</div>
</main>
<footer id="pie"></footer>
<script src="../js/app.js"></script>
<script src="../js/clave.js"></script>
<script>

if (montar({ rol: "candidato", activo: "perfil" })) (async () => {
  const form = document.getElementById("form");
  const cat = await catalogos();
  llenarSelect(form.ubicacion, cat.departamentos, "Sin indicar");
  const p = await api("/candidato/perfil");
  Object.keys(p).forEach((k) => { if (form.elements[k]) form.elements[k].value = p[k] ?? ""; });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const r = await api("/candidato/perfil", { metodo: "PUT", cuerpo: datosForm(form) });
      Sesion.guardar(Sesion.token(), { ...Sesion.usuario(), nombre: r.nombre, apellidos: r.apellidos });
      mensaje("#mensaje", "ok", "Sus datos se guardaron correctamente.");
      form.querySelectorAll(".error-campo").forEach((x) => x.remove());
    } catch (err) { mostrarError(form, err); }
  });
})();

</script>
</body>
</html>
