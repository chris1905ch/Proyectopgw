<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · Vínculo Laboral</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
<header id="cabecera"></header>
<main class="contenedor principal">
<div class="encabezado-pagina"><h1>Panel administrativo</h1></div>
<div id="mensaje"></div>
<div class="pestanas" id="pestanas">
  <button data-vista="resumen" class="activo">Resumen</button>
  <button data-vista="usuarios">Usuarios</button>
  <button data-vista="empresas">Empresas</button>
  <button data-vista="ofertas">Ofertas</button>
</div>
<div id="vista"></div>
</main>
<footer id="pie"></footer>
<script src="../js/app.js"></script>
<script>
if (montar({ rol: "admin", activo: "panel" })) {
  const vista = document.getElementById("vista");

  async function verResumen() {
    const r = await api("/admin/resumen");
    const k = (n, t) => `<div class="kpi"><b>${n}</b><span>${t}</span></div>`;
    const maxD = Math.max(1, ...r.ofertasPorDepartamento.map((x) => x.n));
    const totalP = r.postulacionesPorEstado.reduce((a, x) => a + x.n, 0) || 1;
    vista.innerHTML = `<div class="kpis">${k(r.candidatos, "candidatos")}${k(r.empresas, "empresas")}${k(r.ofertas_activas, "ofertas activas")}${k(r.postulaciones, "postulaciones")}</div>
      <div class="kpis">${k(r.empresas_pendientes, "empresas por verificar")}${k(r.ofertas_pendientes, "ofertas pendientes")}${k(r.suspendidos, "cuentas suspendidas")}</div>
      <div class="dos-col">
        <section class="tarjeta"><h3>Ofertas por departamento</h3>${r.ofertasPorDepartamento.map((x) => `<div class="fila-barra"><span>${esc(x.departamento)}</span><div class="barra"><i style="width:${(x.n / maxD) * 100}%"></i></div><b>${x.n}</b></div>`).join("") || '<p class="vacio">Sin datos.</p>'}</section>
        <section class="tarjeta"><h3>Postulaciones por estado</h3>${r.postulacionesPorEstado.map((x) => `<div class="fila-barra"><span>${ESTADOS[x.estado][0]}</span><div class="barra"><i style="width:${(x.n / totalP) * 100}%"></i></div><b>${x.n}</b></div>`).join("") || '<p class="vacio">Sin datos.</p>'}</section>
      </div>`;
  }

  async function verUsuarios() {
    vista.innerHTML = `<div class="tarjeta"><form id="f" class="fila" style="align-items:end">
      <div class="campo"><label>Buscar</label><input name="q" placeholder="Nombre o correo"></div>
      <div class="campo"><label>Rol</label><select name="rol"><option value="">Todos</option><option value="candidato">Candidato</option><option value="empresa">Empresa</option><option value="admin">Administrador</option></select></div>
      <div class="campo"><label>Estado</label><select name="estado"><option value="">Todos</option><option value="activo">Activo</option><option value="suspendido">Suspendido</option></select></div>
      <div class="campo"><div class="acciones"><button class="boton sec">Filtrar</button><button type="button" class="boton sec" id="exportar">Exportar CSV</button></div></div></form><div id="t"></div></div>`;
    const f = document.getElementById("f");
    async function listar() {
      const q = new URLSearchParams(datosForm(f));
      [...q].forEach(([k, v]) => !v && q.delete(k));
      const filas = await api("/admin/usuarios?" + q);
      document.getElementById("t").innerHTML = filas.length
        ? `<table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Registro</th><th>Estado</th><th></th></tr></thead><tbody>${filas.map((u) => `<tr>
          <td>${esc(u.nombre)} ${esc(u.apellidos)}</td><td>${esc(u.correo)}</td><td>${esc(u.rol)}</td><td>${fecha(u.creado_en)}</td><td>${etiqueta(u.estado)}</td>
          <td>${u.rol === "admin" ? "" : `<button class="boton ${u.estado === "activo" ? "peligro" : "sec"} chico" data-id="${u.id}" data-estado="${u.estado === "activo" ? "suspendido" : "activo"}">${u.estado === "activo" ? "Suspender" : "Reactivar"}</button>`}</td></tr>`).join("")}</tbody></table>`
        : '<p class="vacio">No hay usuarios con esos criterios.</p>';
    }
    f.addEventListener("submit", (e) => { e.preventDefault(); listar(); });
    document.getElementById("exportar").addEventListener("click", async () => {
      const q = new URLSearchParams(datosForm(f));
      [...q].forEach(([k, v]) => !v && q.delete(k));
      try {
        const resp = await fetch("/api/admin/usuarios/exportar?" + q, { headers: { Authorization: "Bearer " + Sesion.token() } });
        if (!resp.ok) throw new Error("No se pudo exportar la lista de usuarios");
        const enlace = document.createElement("a");
        enlace.href = URL.createObjectURL(await resp.blob());
        enlace.download = "usuarios.csv";
        enlace.click();
        URL.revokeObjectURL(enlace.href);
      } catch (err) { mensaje("#mensaje", "error", err.message); }
    });
    document.getElementById("t").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-id]");
      if (!b) return;
      if (b.dataset.estado === "suspendido" && !(await confirmar("¿Suspender esta cuenta?", "La persona no podrá iniciar sesión mientras esté suspendida.", { aceptar: "Suspender", peligro: true }))) return;
      try { await api(`/admin/usuarios/${b.dataset.id}/estado`, { metodo: "PATCH", cuerpo: { estado: b.dataset.estado } }); listar(); }
      catch (err) { mensaje("#mensaje", "error", err.message); }
    });
    listar();
  }

  async function verEmpresas() {
    const filas = await api("/admin/empresas");
    vista.innerHTML = `<div class="tarjeta">${filas.length ? `<table><thead><tr><th>Empresa</th><th>NIT</th><th>Contacto</th><th>Ofertas</th><th>Estado</th><th></th></tr></thead><tbody>${filas.map((e) => `<tr>
      <td><b>${esc(e.razon_social)}</b><br><span class="pequeno suave">${esc(e.sector)} · ${esc(e.departamento)}</span></td><td>${esc(e.nit)}</td>
      <td>${esc(e.contacto)}<br><span class="pequeno suave">${esc(e.correo)}</span></td><td>${e.ofertas}</td>
      <td>${etiqueta(e.verificacion)}${e.motivo_rechazo ? `<br><span class="pequeno suave">${esc(e.motivo_rechazo)}</span>` : ""}</td>
      <td><div class="acciones">${e.verificacion !== "verificada" ? `<button class="boton chico" data-id="${e.id}" data-v="verificada">Verificar</button>` : ""}${e.verificacion !== "rechazada" ? `<button class="boton peligro chico" data-id="${e.id}" data-v="rechazada">Rechazar</button>` : ""}</div></td></tr>`).join("")}</tbody></table>` : '<p class="vacio">No hay empresas registradas.</p>'}</div>`;
    vista.querySelector(".tarjeta").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-id]");
      if (!b) return;
      const cuerpo = { verificacion: b.dataset.v };
      if (b.dataset.v === "rechazada") {
        const motivo = await pedirTexto("Rechazar empresa", "Motivo del rechazo (lo verá la empresa)", { aceptar: "Rechazar", peligro: true });
        if (!motivo) return;
        cuerpo.motivo = motivo;
      }
      try { await api(`/admin/empresas/${b.dataset.id}/verificacion`, { metodo: "PATCH", cuerpo }); mensaje("#mensaje", "ok", "La empresa fue actualizada."); verEmpresas(); }
      catch (err) { mensaje("#mensaje", "error", err.message); }
    });
  }

  async function verOfertas() {
    const filas = await api("/admin/ofertas");
    vista.innerHTML = `<div class="tarjeta">${filas.length ? `<table><thead><tr><th>Oferta</th><th>Empresa</th><th>Cierre</th><th>Aplicantes</th><th>Estado</th><th></th></tr></thead><tbody>${filas.map((o) => `<tr>
      <td><a href="/empleo.html?id=${o.id}">${esc(o.titulo)}</a></td><td>${esc(o.empresa)}</td><td>${fecha(o.fecha_cierre)}</td><td>${o.postulaciones}</td><td>${etiqueta(o.estado)}</td>
      <td>${o.estado === "activa" ? `<button class="boton peligro chico" data-id="${o.id}" data-estado="inactiva">Dar de baja</button>` : o.estado === "inactiva" ? `<button class="boton sec chico" data-id="${o.id}" data-estado="activa">Reactivar</button>` : ""}</td></tr>`).join("")}</tbody></table>` : '<p class="vacio">No hay ofertas.</p>'}</div>`;
    vista.querySelector(".tarjeta").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-id]");
      if (!b) return;
      try { await api(`/admin/ofertas/${b.dataset.id}/estado`, { metodo: "PATCH", cuerpo: { estado: b.dataset.estado } }); verOfertas(); }
      catch (err) { mensaje("#mensaje", "error", err.message); }
    });
  }

  const vistas = { resumen: verResumen, usuarios: verUsuarios, empresas: verEmpresas, ofertas: verOfertas };
  document.getElementById("pestanas").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    document.querySelectorAll("#pestanas button").forEach((x) => x.classList.toggle("activo", x === b));
    mensaje("#mensaje", "ok", "");
    vistas[b.dataset.vista]();
  });
  verResumen();
}
</script>
</body>
</html>
