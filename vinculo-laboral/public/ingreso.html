<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Vínculo Laboral</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<header id="cabecera"></header>
<main class="contenedor principal">

<div class="centrado">
  <h1>Ingresar</h1>
  <div id="mensaje"></div>
  <form id="form" class="tarjeta" novalidate>
    <div class="campo"><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="username" required></div>
    <div class="campo"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="boton" style="width:100%">Ingresar</button>
    <p class="pequeno suave" style="margin:16px 0 0;text-align:center">¿Aún no tiene cuenta? <a href="/registro.html">Crear una cuenta</a></p>
  </form>
</div>
</main>
<footer id="pie"></footer>
<script src="js/app.js"></script>
<script>

montar();
const p = new URLSearchParams(location.search);
if (p.get("expirada")) mensaje("#mensaje", "aviso", "Su sesión terminó. Ingrese de nuevo para continuar.");
const form = document.getElementById("form");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const r = await api("/auth/login", { metodo: "POST", cuerpo: datosForm(form) });
    Sesion.guardar(r.token, r.usuario);
    const volver = p.get("volver");
    location.href = volver && volver.startsWith("/") && !volver.startsWith("//") ? volver : RUTAS_ROL[r.usuario.rol];
  } catch (err) { mostrarError(form, err); }
});

</script>
</body>
</html>
