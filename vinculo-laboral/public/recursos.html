<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursos · Vínculo Laboral</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="cabecera"></header>
<main class="contenedor principal">
<div class="encabezado-pagina"><h1>Recursos y consejos de carrera</h1></div>
<p class="suave" style="max-width:640px">Material corto para preparar una entrevista, armar el currículum y entender mejor el mercado laboral.</p>
<div class="pestanas" id="categorias"></div>
<div id="lista" class="recursos"></div>
</main>
<footer id="pie"></footer>
<script src="js/app.js"></script>
<script src="js/articulos.js"></script>
<script>

montar({ activo: "recursos" });

const categorias = ["Todos", ...new Set(ARTICULOS.map((a) => a.categoria))];
let actual = "Todos";

function dibujar() {
  document.getElementById("categorias").innerHTML = categorias
    .map((c) => `<button data-cat="${esc(c)}" class="${c === actual ? "activo" : ""}">${esc(c)}</button>`).join("");
  const visibles = ARTICULOS.filter((a) => actual === "Todos" || a.categoria === actual);
  document.getElementById("lista").innerHTML = visibles.map((a) => `
    <details class="recurso" id="${a.id}">
      <summary>
        <span class="recurso-titulo">${esc(a.titulo)}</span>
        <span class="recurso-meta">${esc(a.categoria)} · ${a.minutos} min de lectura</span>
        <span class="recurso-resumen">${esc(a.resumen)}</span>
      </summary>
      <div class="recurso-cuerpo">${a.cuerpo.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
    </details>`).join("");
  // Si la dirección trae un artículo (recursos.html#id), se abre al cargar
  const abierto = document.getElementById(location.hash.slice(1));
  if (abierto) { abierto.open = true; abierto.scrollIntoView(); }
}

document.getElementById("categorias").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-cat]");
  if (!b) return;
  actual = b.dataset.cat;
  dibujar();
});
dibujar();
</script>
</body>
</html>
